<!DOCTYPE html>
<html>
<head>

<title>Edit Tarif</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Edit Tarif</h2>

<form method="POST">

<div class="mb-3">

<label>Paket</label>

<input
type="text"
class="form-control"
value="{{ tarif[1] }}"
readonly>

</div>

<div class="mb-3">

<label>Harga</label>

<input
type="number"
name="harga"
class="form-control"
value="{{ tarif[2] }}"
required>

</div>

<button class="btn btn-success">
Simpan
</button>

<a href="/tarif"
class="btn btn-secondary">
Kembali
</a>

</form>

</div>

</body>
</html>
